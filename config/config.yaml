# Configuration du RGP Downloader Lahocy
# Toute URL ou paramètre spécifique au fournisseur IGN doit rester ici,
# jamais codé en dur dans le code (voir docs/RGP_IGN.md).

ign:
  base_url: "https://rgpdata.ign.fr/pub"
  data_dir: "data"          # arborescence RINEX 2 (nom court), voir docs/RGP_IGN.md §2.1
  data_v3_dir: "data_v3"    # arborescence RINEX 3 (nom long IGS), voir docs/RGP_IGN.md §2.2
  logsheet_dir: "logsheet"  # fiches de site IGS (métadonnées + coordonnées), voir §2.3
  cadences: [1, 30]         # cadences observées (secondes) ; l'app vérifie toujours en ligne

network:
  timeout_seconds: 10
  retries: 3
  retry_backoff_seconds: 1.5
  user_agent: "Lahocy-RGP-Downloader/0.1"

cache:
  directory: ".cache"
  catalog_filename: "stations_catalog.json"
  catalog_ttl_days: 30

selection:
  default_station_count: 3
  default_cadence: 1

# Onglet "Stations de référence" : carte des antennes RGP + casters NTRIP,
# recherche par adresse. Le RGP vient du catalogue déjà construit (section ign) ;
# chaque caster NTRIP 2.0 ci-dessous est lu via sa table des mounts (sourcetable) en HTTPS.
reference_networks:
  geocoding_url: "https://data.geopf.fr/geocodage/search"  # géocodeur IGN Géoplateforme
  geocoding_max_results: 5
  nearest_count: 10
  ntrip_cache_ttl_minutes: 15   # l'état en ligne/hors ligne doit rester frais
  offline_retention_days: 90    # une base absente de la table reste affichée "hors ligne" pendant ce délai
  rgp_activity_cache_minutes: 30
  ntrip_casters:
    - id: "centipede"
      name: "Centipède RTK"
      # Le port NTRIP historique 2101 est souvent filtré en entreprise ; le port 443
      # (NTRIP 2.0 sur TLS) est documenté par Centipède : https://docs.centipede-rtk.org/access.html
      sourcetable_url: "https://crtk.net/"
      virtual_mounts: ["NEAR", "NEAR4"]  # mounts "base la plus proche" : pas des antennes physiques
