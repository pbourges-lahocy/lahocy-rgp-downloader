<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, width=device-width">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; }
  .station-popup { font-family: sans-serif; font-size: 13px; }
  .ref-label { font: 600 11px sans-serif; padding: 1px 4px; background: rgba(255,255,255,.85); border: 0; box-shadow: none; }
  .ref-label.leaflet-tooltip-right::before, .ref-label.leaflet-tooltip-top::before { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<script src="leaflet/leaflet.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  var bridge = null;
  new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;
      bridge.notify_map_ready();
  });

  var map = L.map('map', { preferCanvas: true }).setView([46.6, 2.5], 6);  // Centre approximatif de la France
  var tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  tileLayer.on('tileerror', function (e) {
      console.error('Erreur de chargement de tuile : url=' + (e.tile ? e.tile.src : '?'));
  });

  var chantierMarker = null;
  var positionLabel = 'Chantier';
  var stationCircles = {};
  var refLayer = L.layerGroup().addTo(map);
  var refMarkers = {};

  var statusColors = {
      disponible: '#2e7d32',
      partiel: '#f9a825',
      indisponible: '#c62828'
  };

  map.on('click', function (e) {
      setChantier(e.latlng.lat, e.latlng.lng);
      if (bridge) bridge.notify_chantier_clicked(e.latlng.lat, e.latlng.lng);
  });

  function setChantier(lat, lon) {
      if (chantierMarker) {
          chantierMarker.setLatLng([lat, lon]);
      } else {
          chantierMarker = L.marker([lat, lon], { draggable: true }).addTo(map);
          chantierMarker.on('dragend', function () {
              var pos = chantierMarker.getLatLng();
              if (bridge) bridge.notify_chantier_clicked(pos.lat, pos.lng);
          });
      }
      chantierMarker.bindPopup(positionLabel);
  }

  function setPositionLabel(label) {
      positionLabel = label;
      if (chantierMarker) chantierMarker.bindPopup(label);
  }

  function centerOn(lat, lon, zoom) {
      map.setView([lat, lon], zoom || 12);
  }

  var refMeta = {};
  var REF_LABEL_ZOOM = 11;   // au-delà, les noms des antennes visibles s'affichent en permanence
  var REF_LABEL_MAX = 150;   // garde-fou : jamais plus d'étiquettes permanentes que ça

  function setReferenceMarkers(markers) {
      refLayer.clearLayers();
      refMarkers = {};
      refMeta = {};
      markers.forEach(function (m) {
          var c = L.circleMarker([m.lat, m.lon], {
              radius: m.highlight ? 9 : 5,
              color: m.ring,
              weight: m.highlight ? 4 : 2,
              fillColor: m.color,
              fillOpacity: m.fillOpacity
          });
          c.bindPopup(m.popup);
          c.on('click', function () {
              if (bridge) bridge.notify_station_clicked(m.id);
          });
          c.addTo(refLayer);
          refMarkers[m.id] = c;
          refMeta[m.id] = { label: m.label, highlight: m.highlight, labelOn: null };
      });
      updateReferenceLabels();
  }

  // Étiquette permanente (antennes mises en avant, ou zoom rapproché) ou simple info-bulle au survol.
  function setReferenceLabel(id, permanent) {
      var meta = refMeta[id], c = refMarkers[id];
      if (!c || meta.labelOn === permanent) return;
      c.unbindTooltip();
      c.bindTooltip(meta.label, permanent
          ? { permanent: true, direction: 'right', offset: [8, 0], className: 'ref-label' }
          : { direction: 'top', className: 'ref-label' });
      meta.labelOn = permanent;
  }

  function updateReferenceLabels() {
      var zoomOk = map.getZoom() >= REF_LABEL_ZOOM, bounds = map.getBounds(), shown = 0;
      for (var id in refMarkers) {
          var on = refMeta[id].highlight;
          if (!on && zoomOk && shown < REF_LABEL_MAX && bounds.contains(refMarkers[id].getLatLng())) {
              on = true;
              shown++;
          }
          setReferenceLabel(id, on);
      }
  }
  map.on('zoomend moveend', updateReferenceLabels);

  function openReferencePopup(id) {
      var c = refMarkers[id];
      if (c) c.openPopup();
  }

  function fitToPoints(points) {
      if (points.length) map.fitBounds(points, { maxZoom: 12, padding: [40, 40] });
  }

  function clearStations() {
      for (var code in stationCircles) {
          map.removeLayer(stationCircles[code]);
      }
      stationCircles = {};
  }

  function setStations(stations) {
      clearStations();
      stations.forEach(function (s) {
          var color = statusColors[s.status] || '#616161';
          var circle = L.circleMarker([s.lat, s.lon], {
              radius: s.selected ? 10 : 7,
              color: '#222',
              weight: s.selected ? 3 : 1,
              fillColor: color,
              fillOpacity: 0.85
          }).addTo(map);
          circle.bindPopup(
              '<div class="station-popup"><b>' + s.code.toUpperCase() + '</b> — ' + s.name +
              '<br>Distance : ' + s.distance_km.toFixed(1) + ' km' +
              '<br>État : ' + s.status +
              '</div>'
          );
          circle.on('click', function () {
              if (bridge) bridge.notify_station_clicked(s.code);
          });
          stationCircles[s.code] = circle;
      });
  }
</script>
</body>
</html>
